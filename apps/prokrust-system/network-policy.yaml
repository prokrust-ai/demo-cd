apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prokrust-web-api-traefik-ingress
  namespace: prokrust-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prokrust-web-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: traefik-proxy-traefik
    ports:
    - protocol: TCP
      port: 8080
