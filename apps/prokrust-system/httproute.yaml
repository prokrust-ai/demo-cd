apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-browser
  namespace: prokrust-system
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external
    namespace: traefik
    sectionName: websecure
  hostnames:
  - demo.prokrust.ai
  rules:
  - matches:
    - path:
        type: Exact
        value: /
    - path:
        type: PathPrefix
        value: /ui
    - path:
        type: PathPrefix
        value: /auth
    - path:
        type: RegularExpression
        value: ^/prokrust\.
    backendRefs:
    - group: ''
      kind: Service
      name: prokrust-web-api
      port: 8080
      weight: 1
