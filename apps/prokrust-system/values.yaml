connectors:
  bigquery:
    <<: &demoConnector
      enabled: true
      workspaceRbacBindings:
        - thelook-ecommerce
      imagePullSecrets:
        - name: harbor-reader
      nodeSelector: &connectorNodes
        kubernetes.io/arch: arm64
      tolerations: &connectorTolerations
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      runtimeNodeSelector: *connectorNodes
      runtimeTolerations: *connectorTolerations
      controllerApiServerEndpoints:
        - cidr: fd8e:1cf8:6673::1/128
          port: 443
    runtimeNodeSelector:
      <<: *connectorNodes
      kubernetes.io/os: linux
    runtimeServiceAccountName: prokrust-connector-runtime-bigquery
    runtimeSourceTokenAudience: &googleAudience https://iam.googleapis.com/projects/544249942092/locations/global/workloadIdentityPools/prokrust-demo-eks/providers/demo-eks
    runtimeTokenAudiences: [*googleAudience, sts.amazonaws.com]
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
        ports:
          - {protocol: UDP, port: 53}
          - {protocol: TCP, port: 53}
      - to:
          - ipBlock: {cidr: '2001:4860:4840::/45'}
          - ipBlock: {cidr: '2607:f8b0::/32'}
        ports:
          - {protocol: TCP, port: 443}
      - to:
          - ipBlock: {cidr: '2600:1f70:4000::/56'}
          - ipBlock: {cidr: '2600:1f13:db0:ae10::41fe/128'}
          - ipBlock: {cidr: '2600:1f13:db0:ae20::beb5/128'}
        ports:
          - {protocol: TCP, port: 443}
  gcs:
    <<: *demoConnector
    runtimeServiceAccountName: prokrust-connector-runtime-gcs
  iceberg:
    <<: *demoConnector
    runtimeServiceAccountName: prokrust-connector-runtime-iceberg
  paimon:
    <<: *demoConnector
    runtimeServiceAccountName: prokrust-connector-runtime-paimon
  s3:
    <<: *demoConnector
    runtimeServiceAccountName: prokrust-connector-runtime-s3
  synthetic:
    <<: *demoConnector
    runtimeServiceAccountName: prokrust-connector-runtime-synthetic
leaseBootstrap:
  mode: argo
  namespace: argocd
global:
  awsRegion: us-west-2
  networkFamily: IPv6
  workloadPlacementProfile: arm64
  imagePullSecrets:
  - name: harbor-reader
  networkPolicy:
    apiServerEndpoints:
    - cidr: fd8e:1cf8:6673::1/128
      port: 443
    artifactStore:
      cidrs:
      - 2600:1f13:db0:ae10::41fe/128
      - 2600:1f13:db0:ae20::beb5/128
      podSelector: {}
      port: 443
    gcpAuth:
      enabled: true
      metadataEndpoints: []
      googleApiCIDRs:
      - 2001:4860:4840::/45
      - 2607:f8b0::/32
    awsAuth:
      enabled: true
      stsCIDRs: []
      podIdentityAgentEnabled: false
  oidc:
    enabled: true
    revision: 6
    sessionSecret: prokrust-browser-sessions
    providerEgressCIDRs:
    - 35.254.118.132/32
    allowArtifactHostInspection: true
    providers:
      sso:
        issuer: https://auth.prokrust.ai/
        clientId: prokrust-demo
        clientSecret:
          name: prokrust-demo-ory
          key: client-secret
        scopes:
        - openid
        - email
        - profile
        claims:
        - prokrust.ai/role
    installationGrants:
    - providerRef: sso
      rule: claims['prokrust.ai/role'] == 'admin'
      licenseReport: true
      licenseActivation: true
    targets:
    - namespace: thelook-ecommerce
      serviceAccount: prokrust-demo-reviewer
      installationReports: false
    - namespace: thelook-ecommerce
      serviceAccount: prokrust-ui-admin
      installationReports: false
      installationActivation: true
    redis:
      image: docker.io/library/redis:8.8-alpine@sha256:ab669f1420eaa05360a417b24f3bd210c9272e2c79a4bb35d3e50b4bfd50dbee
      storage: 2Gi
      storageClassName: gp3
licensing:
  credentialSecret: prokrust-license-credential
  webhook:
    apiServerIngressCIDRs:
    - 2600:1f13:db0:ae00::/56
artifactCredentials:
  authMode: workload-identity
  workloadIdentity:
    provider: IRSA
    roleArn: arn:aws:iam::390992144652:role/prokrust-demo-prokrust-working-store
web-api:
  webApi:
    artifactWorkloadIdentity:
      provider: IRSA
      roleArn: arn:aws:iam::390992144652:role/prokrust-demo-prokrust-working-store
    enabled: true
    replicas: 2
    browserOrigin: https://demo.prokrust.ai
    argoUiBaseUrl: https://demo.prokrust.ai/argo
workflowIntegrity:
  argoControllerUsername: system:serviceaccount:argo:argo
awsAuth:
  stsNetworkCIDRs:
  - 2600:1f70:4000::/56
