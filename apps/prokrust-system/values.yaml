connectors:
  enabled: true
  registryConfigMap: &registryName prokrust-connector-registry
  registryItems: &registryItems
    - {key: registry.json, path: registry.json}
    - {key: bigquery-connection-v1.json, path: bigquery/connection-v1.json}
    - {key: bigquery-descriptor.json, path: bigquery/descriptor.json}
    - {key: bigquery-selector-v1.json, path: bigquery/selector-v1.json}
    - {key: gcs-connection-v1.json, path: gcs/connection-v1.json}
    - {key: gcs-descriptor.json, path: gcs/descriptor.json}
    - {key: gcs-selector-v1.json, path: gcs/selector-v1.json}
    - {key: iceberg-connection-v1.json, path: iceberg/connection-v1.json}
    - {key: iceberg-descriptor.json, path: iceberg/descriptor.json}
    - {key: iceberg-selector-v1.json, path: iceberg/selector-v1.json}
    - {key: paimon-connection-v1.json, path: paimon/connection-v1.json}
    - {key: paimon-descriptor.json, path: paimon/descriptor.json}
    - {key: paimon-selector-v1.json, path: paimon/selector-v1.json}
    - {key: s3-connection-v1.json, path: s3/connection-v1.json}
    - {key: s3-descriptor.json, path: s3/descriptor.json}
    - {key: s3-selector-v1.json, path: s3/selector-v1.json}
    - {key: synthetic-connection-v1.json, path: synthetic/connection-v1.json}
    - {key: synthetic-descriptor.json, path: synthetic/descriptor.json}
    - {key: synthetic-selector-v1.json, path: synthetic/selector-v1.json}
leaseBootstrap:
  mode: argo
  namespace: argocd
global:
  awsRegion: us-west-2
  networkFamily: IPv6
  workloadPlacementProfile: arm64
  imagePullSecrets:
  - name: harbor-reader
  networkPolicy:
    apiServerEndpoints:
    - cidr: fd8e:1cf8:6673::1/128
      port: 443
    artifactStore:
      cidrs:
      - 2600:1f13:db0:ae10::41fe/128
      - 2600:1f13:db0:ae20::beb5/128
      podSelector: {}
      port: 443
    gcpAuth:
      enabled: true
      metadataEndpoints: []
      googleApiCIDRs:
      - 2001:4860:4840::/45
      - 2607:f8b0::/32
    awsAuth:
      enabled: true
      stsCIDRs: []
      podIdentityAgentEnabled: false
  oidc:
    enabled: true
    revision: 4
    sessionSecret: prokrust-browser-sessions
    providerEgressCIDRs:
    - 35.254.118.132/32
    allowArtifactHostInspection: true
    providers:
      sso:
        issuer: https://auth.prokrust.ai/
        clientId: prokrust-demo
        clientSecret:
          name: prokrust-demo-ory
          key: client-secret
        scopes:
        - openid
        - email
        - profile
        claims:
        - prokrust.ai/role
    targets:
    - namespace: thelook-ecommerce
      serviceAccount: prokrust-demo-reviewer
      installationReports: false
    - namespace: thelook-ecommerce
      serviceAccount: prokrust-ui-admin
      installationReports: false
    redis:
      image: docker.io/library/redis:8.8-alpine@sha256:ab669f1420eaa05360a417b24f3bd210c9272e2c79a4bb35d3e50b4bfd50dbee
      storage: 2Gi
      storageClassName: gp3
licensing:
  credentialSecret: prokrust-license-credential
  webhook:
    apiServerIngressCIDRs:
    - 2600:1f13:db0:ae00::/56
artifactCredentials:
  authMode: workload-identity
  workloadIdentity:
    provider: IRSA
    roleArn: arn:aws:iam::390992144652:role/prokrust-demo-prokrust-working-store
web-api:
  webApi:
    connectorRegistryConfigMap: *registryName
    connectorRegistryItems: *registryItems
    artifactWorkloadIdentity:
      provider: IRSA
      roleArn: arn:aws:iam::390992144652:role/prokrust-demo-prokrust-working-store
    enabled: true
    replicas: 2
    browserOrigin: https://demo.prokrust.ai
    argoUiBaseUrl: https://demo.prokrust.ai/argo
workflowIntegrity:
  argoControllerUsername: system:serviceaccount:argo:argo
awsAuth:
  stsNetworkCIDRs:
  - 2600:1f70:4000::/56
