apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: prokrust-crds
    repo: oci://ar.prokrust.io/charts
    version: 0.24.0-rc.1
    releaseName: prokrust-crd
    includeCRDs: true
    valuesFile: values.yaml

# The API server omits the obsolete false value on readback.
patches:
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: unused
      spec:
        preserveUnknownFields: null
