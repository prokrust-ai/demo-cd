apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-oidc-viewer
  namespace: thelook-ecommerce
  annotations:
    workflows.argoproj.io/rbac-rule: "'guest' in groups || 'admin' in groups"
    workflows.argoproj.io/rbac-rule-precedence: '10'
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-oidc-viewer
  namespace: thelook-ecommerce
rules:
- apiGroups: [argoproj.io]
  resources: [workflows]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [pods]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [pods/log]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-oidc-viewer
  namespace: thelook-ecommerce
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: argo-oidc-viewer}
subjects:
- {kind: ServiceAccount, name: argo-oidc-viewer, namespace: thelook-ecommerce}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-server-sso
  namespace: thelook-ecommerce
rules:
- apiGroups: ['']
  resources: [serviceaccounts]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [secrets]
  resourceNames: [argo-oidc-viewer.service-account-token]
  verbs: [get]
- apiGroups: [argoproj.io]
  resources: [workflows, workflowtemplates]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-server-sso
  namespace: thelook-ecommerce
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: argo-server-sso}
subjects:
- {kind: ServiceAccount, name: argo-server-sso, namespace: argo}
