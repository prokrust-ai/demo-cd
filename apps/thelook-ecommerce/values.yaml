installation:
  namespace: prokrust-system
connectors:
  enabled: true
  artifactAccess:
    bigquery:
      serviceAccount:
        name: prokrust-connector-runtime-bigquery
        create: false
      auth:
        provider: IRSA
        roleArn: arn:aws:iam::390992144652:role/prokrust-demo-connector-bigquery-staging
  artifactNetworkPolicy:
    enabled: false
  connectionResources:
  - {apiGroup: google.sources.prokrust.ai, resource: bigqueryconnections}
  - {apiGroup: google.sources.prokrust.ai, resource: gcsconnections}
  - {apiGroup: apache.sources.prokrust.ai, resource: icebergconnections}
  - {apiGroup: apache.sources.prokrust.ai, resource: paimonconnections}
  - {apiGroup: aws.sources.prokrust.ai, resource: s3connections}
  - {apiGroup: sources.prokrust.ai, resource: syntheticconnections}
global:
  awsRegion: us-west-2
  networkFamily: IPv6
  workloadPlacementProfile: arm64
  imagePullSecrets:
  - name: harbor-reader
  networkPolicy:
    apiServerEndpoints:
    - cidr: fd8e:1cf8:6673::1/128
      port: 443
    artifactStore:
      cidrs:
      - 2600:1f13:db0:ae10::41fe/128
      - 2600:1f13:db0:ae20::beb5/128
      podSelector: {}
      port: 443
    gcpAuth:
      enabled: true
      metadataEndpoints: []
      googleApiCIDRs:
      - 2001:4860:4840::/45
      - 2607:f8b0::/32
    awsAuth:
      enabled: true
      stsCIDRs: []
      podIdentityAgentEnabled: false
awsAuth:
  stsNetworkCIDRs:
  - 2600:1f70:4000::/56
namespaceResources:
  resourceQuota:
    limits.ephemeral-storage: 256Gi
    requests.ephemeral-storage: 128Gi
access:
  serviceAccounts:
  - prokrust-demo-reviewer
  - prokrust-ui-admin
  bindings:
    demo-guest:
      providerRef: sso
      serviceAccountRef:
        name: prokrust-demo-reviewer
      rule: claims['prokrust.ai/role'] == 'guest'
      displayName: Demo guest
    demo-admin:
      providerRef: sso
      serviceAccountRef:
        name: prokrust-ui-admin
      rule: claims['prokrust.ai/role'] == 'admin'
      displayName: Demo admin

workspace:
  placementTemplates:
    cpu-training:
      allowedRoles: [trainer]
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
      - key: kubernetes.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
    gpu-training:
      allowedRoles: [trainer]
      nodeSelector:
        kubernetes.io/arch: amd64
        karpenter.sh/nodepool: performance-qualification-gpu
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
  placementDefaults:
    trainer:
      name: cpu-training
  ballistaAccounts: external
  storage:
    backend: S3
    bucket: prokrust-demo-working-390992144652-us-west-2-an
    prefix: artifacts/thelook-ecommerce/
    region: us-west-2
    auth:
      provider: IRSA
      roleArn: arn:aws:iam::390992144652:role/prokrust-demo-prokrust-working-store
    ballistaAuth:
      provider: IRSA
      roleArn: arn:aws:iam::390992144652:role/prokrust-demo-prokrust-ballista-store
