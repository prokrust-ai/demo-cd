apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
  name: prokrust-lease-bootstrap-11c50d8075
  namespace: argocd
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prokrust-lease-bootstrap-11c50d8075
    spec:
      containers:
      - args:
        - |
          # kubectl with a request timeout can skip in-cluster discovery.
          api_host="${KUBERNETES_SERVICE_HOST:?Kubernetes Service host is required}"
          api_port="${KUBERNETES_SERVICE_PORT:?Kubernetes Service port is required}"
          case "$api_host" in *:*) api_host="[$api_host]";; esac
          umask 077
          export KUBECONFIG="$HOME/prokrust-hook-kubeconfig"
          cat > "$KUBECONFIG" <<EOF
          apiVersion: v1
          kind: Config
          current-context: incluster
          clusters:
          - name: local
            cluster:
              server: "https://$api_host:$api_port"
              certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          contexts:
          - name: incluster
            context:
              cluster: local
              user: hook
          users:
          - name: hook
            user:
              tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          EOF
          if [ -n "$CRD_BUNDLE_SHA256" ]; then
            for crd in licenseactivations.platform.prokrust.ai prokrustaccessbindings.platform.prokrust.ai; do
              observed="$(kubectl --request-timeout=10s get crd "$crd" \
                -o 'jsonpath={.spec.scope}{"|"}{.metadata.annotations.prokrust\.ai/crd-bundle-sha256}')" || {
                echo "Cannot read $crd. Install the compatible prokrust-crds release first." >&2
                exit 1
              }
              if [ "$observed" != "Namespaced|$CRD_BUNDLE_SHA256" ]; then
                echo "$crd does not match the required Prokrust API schema bundle $CRD_BUNDLE_SHA256." >&2
                exit 1
              fi
            done
          fi
          # Preserve active holder and renewal fields.
          exec kubectl apply --server-side --field-manager=prokrust-lease-bootstrap -f /config/leases.yaml
        command:
        - /bin/sh
        - -ec
        env:
        - name: HOME
          value: /tmp
        - name: CRD_BUNDLE_SHA256
          value: 5a1536205b4519785829fc3400bed5346c3bcf4509072d8e5f87b98799c0fba8
        image: docker.io/alpine/kubectl:1.36.4@sha256:a2cd8ee034cbe04d651e565b3373299b31921de5c2af86490559e21b3e197808
        name: bootstrap
        resources:
          limits:
            cpu: 250m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /config
          name: config
          readOnly: true
        - mountPath: /tmp
          name: tmp
      nodeSelector:
        kubernetes.io/arch: arm64
      restartPolicy: Never
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: prokrust-lease-bootstrap-11c50d8075
      tolerations:
      - effect: NoSchedule
        key: kubernetes.io/arch
        operator: Equal
        value: arm64
      volumes:
      - configMap:
          name: prokrust-lease-bootstrap-11c50d8075
        name: config
      - emptyDir:
          sizeLimit: 16Mi
        name: tmp
---
