  name: prokrust-application-controller
  namespace: prokrust-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prokrust-application-controller
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        prokrust.ai/connector-registry-checksum: 8808e5c03847fa5779f8dbef3e2ef077db5036bf6528b4651041938ed7dca930
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: prokrust-application-controller
        app.kubernetes.io/part-of: prokrust
        prokrust.ai/aws-auth: "true"
    spec:
      automountServiceAccountToken: true
      containers:
      - args:
        - --role
        - application
        - --namespace
        - $(RP_POD_NAMESPACE)
        env:
        - name: RP_PROFILING_ENABLED
          value: "false"
        - name: PROKRUST_CONNECTORS_ENABLED
          value: "true"
        - name: AWS_REGION
          value: us-west-2
        - name: AWS_DEFAULT_REGION
          value: us-west-2
        - name: PROKRUST_CONNECTOR_CONFIG
          value: /etc/prokrust/connectors/registry.json
        - name: PROKRUST_SERVING_ENABLED
          value: "false"
        - name: PROKRUST_SERVING_WORKLOAD_PLACEMENT_PROFILE
          value: inherit
        - name: PROKRUST_NETWORK_FAMILY
          value: IPv6
        - name: PROKRUST_LICENSE_WORKLOAD_METRICS
          value: "false"
        - name: PROKRUST_LICENSE_WORKLOAD_METRICS_MAX_OWNERS
          value: "1000"
        - name: PROKRUST_STARTUP_TLS_SECRET
          value: prokrust-runtime-startup-tls
        - name: PROKRUST_LICENSE_METRICS_ADDRESS
          value: '[::]:8082'
        - name: RP_PRODUCER_PROVENANCE
          value: '{"batchPredictor":{"images":["ar.prokrust.io/prokrust/batch-predictor@sha256:1a84f9abc224c765b8e947b55fe5d6ef38553f5505b0df4d56f87f572a6e1544"],"version":"0.11.0-rc.1"},"dataJob":{"images":["ar.prokrust.io/prokrust/data-job@sha256:65bfb6fbb828df79a48b9baeca3d721072bd26319135591083b06011e1957581"],"version":"0.13.0-rc.1"},"trainer":{"images":["ar.prokrust.io/prokrust/trainer-cuda@sha256:7697b034af65d75e9e22ace78e1de2ffe8902257c701b8b511c9f48a1719eac1","ar.prokrust.io/prokrust/trainer@sha256:6f500c234cc66450e4b7e2a61c4c7f25f5f7f0f0b60d187805a6f2d9386777b7"],"version":"0.11.0-rc.1"}}'
        - name: PROKRUST_ARGO_CONTROLLER_USERNAME
          value: system:serviceaccount:argo:argo
        - name: PROKRUST_WORKFLOW_SCHEDULING_PROFILE
          value: standard
        - name: PROKRUST_WORKLOAD_PLACEMENT_PROFILE
          value: arm64
        - name: PROKRUST_WORKFLOW_IMAGE_PULL_SECRETS
          value: '[{"name":"harbor-reader"}]'
