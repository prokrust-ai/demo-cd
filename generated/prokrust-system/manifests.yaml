            fieldRef:
              fieldPath: metadata.namespace
        - name: RP_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: PROKRUST_CONTROLLER_SERVICE_ACCOUNT_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PROKRUST_CONTROLLER_SERVICE_ACCOUNT_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        - name: RP_ARTIFACT_AWS_IDENTITY_PROVIDER
          value: irsa
        - name: RP_ARTIFACT_AWS_ROLE_ARN
          value: arn:aws:iam::390992144652:role/prokrust-demo-prokrust-working-store
        - name: RP_ARTIFACT_AUTH_MODE
          value: workload-identity
        image: ar.prokrust.io/prokrust/operator@sha256:f0600f2a0552970b788327760f5841688d142d08574edc499b71eb9c02195e8c
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 10
        name: operator
        ports:
        - containerPort: 8081
