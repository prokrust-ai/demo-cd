apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prokrust-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/prokrust-ai/demo-cd.git
    targetRevision: main
    path: generated/prokrust-system
    directory:
      recurse: false
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: prokrust-system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - FailOnSharedResource=true
