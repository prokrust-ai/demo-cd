apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prokrust-crd
  namespace: argocd
spec:
  project: prokrust
  source:
    repoURL: https://github.com/prokrust-ai/demo-cd.git
    targetRevision: main
    path: generated/prokrust-crd
    directory:
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: prokrust-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
